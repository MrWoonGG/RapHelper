name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # або master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Підставляємо секрети з GitHub Secrets у index.html
      - name: Inject Secrets
        run: |
          sed -i 's|__JSONBIN_BIN_ID__|${{ secrets.JSONBIN_BIN_ID }}|g' index.html
          sed -i 's|__JSONBIN_API_KEY__|${{ secrets.JSONBIN_API_KEY }}|g' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
